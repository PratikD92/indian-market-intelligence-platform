# REGULATORY INFORMATION
endpoint: /v1/companies/{ticker}/regulations
method: GET
summary: Pre-ingested regulatory info returned as-is (Valkey → Postgres, no LLM).
owner_service: Research API Service
personas: [Compliance Officer]
request:
  ticker: string   # path
response:
  ticker: string
  regulations:
    - title: string
      text: string
      source: string


# COMPARE COMPANIES
endpoint: /v1/companies/compare
method: POST
summary: Compare companies. Fetch Agent queries GraphRAG and produces a fixed-format comparison, Valkey is checked first.
owner_service: Research Orchestrator
personas: [Financial Analyst]
request:
  tickers: [string]
response:
  request_id: uuid
  comparison: object
  sources:
    - title: string
      source: string