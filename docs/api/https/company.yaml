
# OWNERSHIP ANALYSIS
endpoint: /v1/companies/{ticker}/ownership
method: POST
summary: Ownership analysis. Fetch Agent queries GraphRAG, Valkey is checked first.
owner_service: Research Orchestrator
personas: [Compliance Officer]
request:
  ticker: string   # path
response:
  request_id: uuid
  ticker: string
  ownership: object
  sources:
    - title: string
      source: string
usage:
  - /v1/companies/HDFCBANK/ownership
  - /v1/companies/TATAMOTORS/ownership


