# MARKET DATA SYNC
endpoint: /internal/v1/market-data/sync
method: POST
summary: Scheduler-triggered ingestion for market data, news and regulatory sources.
owner_service: Market Data Ingestion Service
personas: []
request:
  source: string?
response:
  request_id: uuid
  status: string
usage:
# tickers are in the body, so the body is shown inline
  - /internal/v1/market-data/sync {"source": "NSE"}
  - /internal/v1/market-data/sync {}