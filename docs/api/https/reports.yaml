# VIEW REPORT
endpoint: /v1/companies/{ticker}/report
method: GET
summary: View existing report for a company. Research report takes priority over search report.
owner_service: Report Workflow Service
personas: [Casual Investor, Financial Analyst, Compliance Officer]
request:
  ticker: string   # path
response:
  ticker: string
  report_type: enum[research, search]
  report: object


# GENERATE REPORT
endpoint: /v1/companies/{ticker}/report-generate
method: POST
summary: Generate Report, async. Returns 200 with completed if a report already exists, otherwise 202 and starts the HITL-simulated workflow. Completion is announced by the reportGenerated event.
owner_service: Report Workflow Service
personas: [Financial Analyst]
request:
  ticker: string   # path
  report_type: string?
response:
  report_id: uuid
  status: enum[pending, completed]