
# RESEARCH COMPANY
endpoint: /v1/companies/{ticker}/research
method: POST
summary: Research Company, synchronous. Returns stored report, or one assembled from Postgres + pgvector, or multi-agent output for wtf companies.
owner_service: Research Orchestrator
personas: [Financial Analyst]
request:
  ticker: string   # path
  research_type: string?
response:
  request_id: uuid
  ticker: string
  report: object