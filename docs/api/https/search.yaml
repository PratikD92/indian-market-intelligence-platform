# COMPANY PROFILE LOOKUP
endpoint: /v1/companies/{ticker}
method: GET
summary: Deterministic company profile lookup from the curated pool (no LLM).
owner_service: Research API Service
personas: [Casual Investor]
request:
  ticker: string   # path
response:
  ticker: string
  name: string
  founded_date: string
  ceo_owner: string
  headquarters: string
  industry: string
  source: string
usage:
  - /v1/companies/HDFCBANK
  - /v1/companies/RELIANCE